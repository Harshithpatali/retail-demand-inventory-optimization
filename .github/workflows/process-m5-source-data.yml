name: process-m5-source-data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/download_m5_from_supabase.py
      - scripts/run_full_population_eda.py
      - scripts/prepare_data.py
      - scripts/build_features.py
      - scripts/load_retail_warehouse.py
      - scripts/upload_m5_to_r2.py
      - scripts/train_full_population_forecaster.py
      - .github/workflows/process-m5-source-data.yml

permissions:
  contents: write

concurrency:
  group: process-m5-source-data
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install data pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt matplotlib==3.9.3

      - name: Download and validate original M5 archive from private Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: m5-raw-data
          M5_ZIP_PATH: ${{ secrets.M5_ZIP_PATH }}
          KEEP_M5_ARCHIVE: "1"
        run: python -m scripts.download_m5_from_supabase

      - name: Run full-population EDA on original M5 sales matrix
        run: python -m scripts.run_full_population_eda

      - name: Train and evaluate 28-day global model on all 30,490 series
        run: python -m scripts.train_full_population_forecaster

      - name: Verify full-population forecast artifacts before publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pyarrow.parquet as pq
          root = Path("reports/full_population_forecasting")
          forecast = root / "forecast_28d_all_series.parquet"
          metrics = root / "full_population_forecast_metrics.csv"
          metadata = root / "forecast_run_metadata.json"
          for path in (forecast, metrics, metadata):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty forecast artifact: {path}")
          meta = json.loads(metadata.read_text())
          expected = 30_490 * 28
          actual = pq.ParquetFile(forecast).metadata.num_rows
          if actual != expected or meta.get("forecast_rows") != expected:
              raise SystemExit(f"Expected {expected:,} forecasts; found parquet={actual:,}, metadata={meta.get('forecast_rows')}")
          print(f"Verified {actual:,} forecast rows for 30,490 series x 28 days.")
          print("Metrics:", metrics.stat().st_size, "bytes")
          PY

      - name: Rebuild cleaned and feature datasets from original source
        run: |
          python -m scripts.prepare_data
          python -m scripts.build_features

      - name: Validate generated datasets
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          cleaned_path = Path("data/interim/cleaned_sales.parquet")
          features_path = Path("data/processed/forecast_features.parquet")
          report_path = Path("data/interim/validation_report.json")
          for path in (cleaned_path, features_path, report_path):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty output: {path}")

          cleaned = pd.read_parquet(cleaned_path)
          features = pd.read_parquet(features_path)
          report = json.loads(report_path.read_text())
          required = {"id", "date", "demand"}
          if not required.issubset(cleaned.columns):
              raise SystemExit(f"Cleaned data missing columns: {required - set(cleaned.columns)}")
          if not required.issubset(features.columns):
              raise SystemExit(f"Feature data missing columns: {required - set(features.columns)}")
          if cleaned.empty or features.empty:
              raise SystemExit("Generated datasets must not be empty.")
          print("Cleaned panel:", cleaned.shape, "series:", cleaned.id.nunique())
          print("Feature panel:", features.shape, "series:", features.id.nunique())
          print("Validation report keys:", sorted(report))
          print("Feature date range:", features.date.min(), "to", features.date.max())
          PY

      - name: Install Cloudflare R2 uploader
        run: python -m pip install boto3==1.35.90

      - name: Upload original archive, extracted source and processed Parquet to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: m5-retail-analytics
          R2_REGION: auto
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::warning::R2 credentials are not configured; skipping R2 upload. Add R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY, then rerun this workflow."
            exit 0
          fi
          python -m scripts.upload_m5_to_r2

      - name: Publish compact analytical panel to Supabase PostgreSQL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_BUCKET: m5-raw-data
          M5_ZIP_PATH: ${{ secrets.M5_ZIP_PATH }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL is not configured; curated panel remains in Parquet artifacts."
            exit 0
          fi
          python -m scripts.load_retail_warehouse

      - name: Remove temporary raw CSVs and downloaded ZIP
        if: always()
        run: |
          rm -rf data/raw .m5_download

      - name: Stage full-population EDA outputs explicitly
        if: success()
        run: git add -f reports/eda/full_data/

      - name: Commit processed data to main
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: rebuild M5 processed datasets from original source"
          branch: main
          file_pattern: |
            data/interim/cleaned_sales.parquet
            data/interim/validation_report.json
            data/processed/forecast_features.parquet
            reports/eda/full_data/
