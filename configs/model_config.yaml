validation_days: 28
test_days: 28
random_seed: 42
n_jobs: 2
xgboost:
  n_estimators: 250
  learning_rate: 0.05
  max_depth: 7
  min_child_weight: 5
  subsample: 0.85
  colsample_bytree: 0.85
  reg_alpha: 0.0
  reg_lambda: 1.0
  objective: reg:squarederror
lightgbm:
  n_estimators: 250
  learning_rate: 0.05
  num_leaves: 31
  max_depth: -1
  min_child_samples: 30
  subsample: 0.85
  colsample_bytree: 0.85
