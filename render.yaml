services:
  - type: web
    name: retail-demand-api
    runtime: python
    buildCommand: pip install -r requirements-api.txt && python -m scripts.estimate_uncertainty
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: API_HISTORY_DAYS
        value: "365"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://retail-demand-inventory-optimization-v1.streamlit.app,http://localhost:8501,http://127.0.0.1:8501"
